This page allows roommates to create and manage chores.

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="main.css" rel="stylesheet">
        <script src="chores.js" defer></script>

        <link
            href="https://fonts.googleapis.com/css2?family=PT+Serif+Caption:ital@0;1&display=swap"
            rel="stylesheet"
        >

        <title>Responsible Roommates - Chores</title>
    </head>

    <body>
        <header>
            <div id="logo">
                <h1>Responsible Roommates</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="main.html">Main</a></li>
                    <li><a href="help.html">Help</a></li>
                    <li><a href="history.html">History</a></li>
                    <li><a href="chores.html" class="active">Chores</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="chores">
                <h2>My Chores</h2>

                <div id="chore-list">
                    <p>No chores added</p>
                </div>

                <button id="expand-chore-btn">+ Add Chore</button>
                <div id="chore-form">
                    <div>
                        <h3>Name of Chore</h3>
                        <label for="task">Chore name:</label>
                        <input type="text" id="task" placeholder="ex: Vacuuming">
                    </div>
                    <div>
                        <h3>Due Date</h3>
                        <label for="deadline">Due date:</label>
                        <input type="date" id="deadline">
                    </div>
                    <div>
                        <h3>Assign to</h3>
                        <input type="checkbox" id="select-all" checked>
                        <label for="select-all">Select All</label>
                        <div id="split-chores"></div>
                    </div>
                    <button id="split-chore-btn">Add Chore</button>
                    <div id="chore-error"></div>
                </div>
            </section>
        </main>

        <footer id="attributions">
            Portions of this page © 2026 Naman Agrawal, other attributions cited in page source
        </footer>
    </body>
</html>
